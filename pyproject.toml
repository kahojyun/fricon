[project]
name = "fricon"
version = "0.0.0"
description = "v0.2 clean-reset planning workspace for Fricon."
readme = "README.md"
requires-python = ">=3.10"
license-files = [
  "LICENSE-APACHE",
  "LICENSE-MIT",
]
authors = [{ name = "Jiahao Yuan", email = "kahojyun@icloud.com" }]

[project.urls]
Documentation = "https://kahojyun.github.io/fricon/"
Issues = "https://github.com/kahojyun/fricon/issues"
Source = "https://github.com/kahojyun/fricon"

[dependency-groups]
docs = ["mkdocs-material>=9.5.49"]

[tool.uv]
default-groups = ["docs"]
package = false
