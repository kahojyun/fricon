# Keep this prek-compatible config minimal during the docs design phase:
# basic text/config hygiene only, without language builds, dependency updates,
# generated-artifact checks, or test gates.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
  - repo: https://github.com/tombi-toml/tombi-pre-commit
    rev: 3a28f1f8a58c75b8ceedd4579faec7c677644613  # frozen: v0.11.5
    hooks:
      - id: tombi-format
        args: ["--offline"]
